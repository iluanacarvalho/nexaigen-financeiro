name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Postgres efêmero só pra esta execução (mesmo padrão do ci.yml do
    # nexaigen-educa) — os testes de integração (*.integration.test.ts)
    # rodam contra um banco de verdade, com as migrations aplicadas.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexaigen
          POSTGRES_PASSWORD: nexaigen_ci
          POSTGRES_DB: nexaigen_financeiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexaigen -d nexaigen_financeiro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valores FICTÍCIOS, só pra CI — nunca reaproveitar em staging/produção.
      DATABASE_URL: postgres://nexaigen:nexaigen_ci@localhost:5432/nexaigen_financeiro
      JWT_SECRET: ci-apenas-nao-usar-em-producao-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm run test

      - name: Testes de componente (telas, jsdom)
        run: npm run test:component

      - name: Migrar banco
        run: npm run migrate

      - name: Testes de integração (Postgres real)
        run: npm run test:integration

      # Nenhuma variável própria: o build só precisa que DATABASE_URL EXISTA
      # (já definida no `env` do job) — lib/db.ts cria o Pool ao carregar o
      # módulo e o Next carrega as rotas na fase "Collecting page data", mas
      # NADA conecta ao banco durante o build (conferido na rodada 07: build
      # com ambiente vazio + só uma DATABASE_URL fictícia apontando pra uma
      # porta fechada passa; sem DATABASE_URL nenhuma, falha). As
      # NEXT_PUBLIC_SUPABASE_*/SUPABASE_SERVICE_ROLE_KEY que existiam aqui
      # sobraram da arquitetura anterior e foram removidas.
      - name: Build
        run: npm run build
